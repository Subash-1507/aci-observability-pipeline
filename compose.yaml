# Local copy of the Azure Container Instances group: the same three containers, on this machine only.
name: order-observability

services:
  order-api:
    build: ./app
    ports:
      - "127.0.0.1:8000:8000" # loopback only
    environment:
      REDIS_HOST: redis
      OTEL_SERVICE_NAME: order-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.version=${APP_VERSION:-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: delta
      OTEL_METRIC_EXPORT_INTERVAL: "10000" # every 10 s locally, for quick feedback
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: "health" # health checks are noise: no traces for them
      OTEL_SEMCONV_STABILITY_OPT_IN: http # stable HTTP names: http.server.request.duration in seconds
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [redis, otel-collector]

  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    command: ["redis-server", "--save", "", "--appendonly", "no"] # cache only: nothing written to disk
    user: "999:999" # the image's redis user, so the start script never runs as root
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0-386@sha256:40392928d2b988b77e7525dbac33e5e3d9bedb40b9ff8c1f9119d92ca3a8a1c3
    command: ["--config=/etc/otelcol-contrib/config.yaml"] # Compose replaces only the arguments, not the program
    env_file: .env # vendor API keys; only the Collector gets them, never the API
    ports:
      - "127.0.0.1:13133:13133" # health check, loopback only
      - "127.0.0.1:8888:8888" # Collector self-metrics, loopback only
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
